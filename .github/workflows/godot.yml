# Polderrace 3D (Godot): run the Godot tests and build the game for Windows and Linux on every push that touches godot/.
# The builds are attached to the run as artifacts ("Polderrace-Windows", "Polderrace-Linux", "Polderrace-Setup"), and a
# build of the default branch replaces the GitHub release "pc-nieuwste" (the download page, see godot/README.md):
# https://github.com/<owner>/<repo>/releases/latest/download/Polderrace-Setup.exe always is the newest installer.
name: Godot build

on:
  push:
    paths:
      - "godot/**"
      - ".github/workflows/godot.yml"
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # the release with the downloads
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and export templates
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-stable

      - name: Download Godot and export templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          cd ~/godot
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
          curl -sSL -o tpl.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -j tpl.tpz "templates/windows_release_x86_64.exe" "templates/linux_release.x86_64" "templates/version.txt" \
            -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          rm tpl.tpz

      - name: Import project
        run: ~/godot/godot --headless --path godot --import || true

      - name: Tests
        run: ~/godot/godot --headless --path godot res://tests/runner.tscn -- track build laps cars flow audio menus rules memory

      - name: Playthrough with real keys and mouse clicks (own run, about 11 minutes)
        run: ~/godot/godot --headless --path godot res://tests/runner.tscn -- play

      - name: Online test (host and player as two processes)
        run: PATH="$HOME/godot:$PATH" python3 godot/tests/test_net.py

      - name: Export Windows and Linux
        run: |
          mkdir -p godot/build/windows godot/build/linux
          ~/godot/godot --headless --path godot --export-release "Windows Desktop" build/windows/Polderrace.exe
          ~/godot/godot --headless --path godot --export-release "Linux" build/linux/Polderrace.x86_64
          cp godot/README.md godot/build/windows/LEESMIJ.md
          cp godot/README.md godot/build/linux/LEESMIJ.md
          ls -la godot/build/windows godot/build/linux

      - uses: actions/upload-artifact@v4
        with:
          name: Polderrace-Windows
          path: godot/build/windows/

      - uses: actions/upload-artifact@v4
        with:
          name: Polderrace-Linux
          path: godot/build/linux/

      - name: Windows installer (desktop and Start menu shortcut)
        run: |
          sudo apt-get install -y -qq nsis > /dev/null
          mkdir -p godot/build/installer
          cd godot/installer && makensis -V2 -DVERSION=1.0.${{ github.run_number }} polderrace.nsi
          ls -la ../build/installer

      - uses: actions/upload-artifact@v4
        with:
          name: Polderrace-Setup
          path: godot/build/installer/

      - name: Download page (GitHub release "pc-nieuwste", only for the default branch)
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd godot/build
          (cd windows && zip -q -r ../Polderrace-Windows.zip .)
          (cd linux && zip -q -r ../Polderrace-Linux.zip .)
          gh release delete pc-nieuwste --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create pc-nieuwste --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "Polderrace 3D voor pc (versie 1.0.${{ github.run_number }})" --notes-file ../installer/release-notes.md \
            installer/Polderrace-Setup.exe Polderrace-Windows.zip Polderrace-Linux.zip
